services:
  coturn:
    image: coturn/coturn:latest
    container_name: syncmove-turn
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    environment:
      - TURN_SERVER_NAME=${COTURN_DOMAIN:-localhost}
      - REALM=${COTURN_REALM:-syncmove.local}
      - SECRET=${COTURN_SECRET:-your-secret-key-here}
      - min-port=49152
      - max-port=65535
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn-data:/var/lib/coturn
    networks:
      - syncmove-network

volumes:
  coturn-data:

networks:
  syncmove-network:
    driver: bridge