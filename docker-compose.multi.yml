services:
  nginx:
    image: nginx:1.27-alpine
    container_name: syncmove-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-node-1
      - app-node-2
    networks:
      - syncmove-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syncmove-redis
    ports:
      - "6379:6379"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  coturn:
    image: coturn/coturn:latest
    container_name: syncmove-turn
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TURN_SERVER_NAME: ${COTURN_DOMAIN:-localhost}
      REALM: ${COTURN_REALM:-syncmove.local}
      SECRET: ${COTURN_SECRET:-your-secret-key-here}
      min-port: 49152
      max-port: 65535
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn-data:/var/lib/coturn
    networks:
      - syncmove-network

  mariadb-primary:
    image: mariadb:10.11
    container_name: syncmove-db-primary
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syncmove
      MYSQL_USER: syncmove
      MYSQL_PASSWORD: syncmovepass
    ports:
      - "3307:3306"
    volumes:
      - mariadb-primary-data:/var/lib/mysql
    networks:
      - syncmove-network
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --gtid-strict-mode=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mariadb-replica:
    image: mariadb:10.11
    container_name: syncmove-db-replica
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syncmove
      MYSQL_USER: syncmove
      MYSQL_PASSWORD: syncmovepass
    ports:
      - "3308:3306"
    depends_on:
      mariadb-primary:
        condition: service_healthy
    networks:
      - syncmove-network
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --log-bin=mysql-bin
      --relay-log=/var/lib/mysql/mysql-relay-bin
      --read-only=1
      --gtid-strict-mode=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db-failover:
    image: mariadb:10.11
    container_name: syncmove-db-failover
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
    environment:
      PRIMARY_HOST: mariadb-primary
      REPLICA_HOST: mariadb-replica
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      REPLICA_USER: replica
      REPLICA_PASSWORD: replica
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - syncmove-network
    command: >
      bash -lc "chmod +x /scripts/db-failover.sh /scripts/db-rejoin-replica.sh && /scripts/db-failover.sh"
    restart: unless-stopped

  app-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmove-app-1
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-primary:3306/syncmove
      REPLICA_DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-replica:3306/syncmove
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      UPLOADTHING_SECRET: ${UPLOADTHING_SECRET}
      UPLOADTHING_APP_ID: ${UPLOADTHING_APP_ID}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      NEXT_PUBLIC_TURN_SERVER_URL: ${NEXT_PUBLIC_TURN_SERVER_URL}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL}
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3000"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: sh -c "npx prisma generate && npm run start"

  app-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmove-app-2
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-primary:3306/syncmove
      REPLICA_DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-replica:3306/syncmove
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      UPLOADTHING_SECRET: ${UPLOADTHING_SECRET}
      UPLOADTHING_APP_ID: ${UPLOADTHING_APP_ID}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      NEXT_PUBLIC_TURN_SERVER_URL: ${NEXT_PUBLIC_TURN_SERVER_URL}
      NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL}
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3002:3000"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: sh -c "npx prisma generate && npm run start"

volumes:
  mariadb-primary-data:
  coturn-data:

networks:
  syncmove-network:
    driver: bridge
