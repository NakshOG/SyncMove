version: '3.8'
services:
  # Mediasoup SFU Server (replaces P2P mesh + Coturn)
  mediasoup-sfu:
    image: node:20-alpine
    container_name: syncmove-sfu
    working_dir: /app/server
    command: sh -c "npm install mediasoup socket.io tsx && npx tsx mediasoup-server.ts"
    ports:
      - "3333:3333"
      - "49152-65535:49152-65535/udp"
    environment:
      - MEDIASOUP_ANNOUNCED_IP=localhost
      - MEDIASOUP_PORT=3333
      - MEDIASOUP_RTC_MIN_PORT=49152
      - MEDIASOUP_RTC_MAX_PORT=65535
    volumes:
      - ./server:/app/server
    networks:
      - syncmove-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: syncmove-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-node-1
      - app-node-2
      - mediasoup-sfu
    networks:
      - syncmove-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: syncmove-redis
    ports:
      - "6379:6379"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  mariadb-primary:
    image: mariadb:10.11
    container_name: syncmove-db-primary
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syncmove
      MYSQL_USER: syncmove
      MYSQL_PASSWORD: syncmovepass
    ports:
      - "3307:3306"
    volumes:
      - mariadb-primary-data:/var/lib/mysql
    networks:
      - syncmove-network
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --gtid-strict-mode=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mariadb-replica:
    image: mariadb:10.11
    container_name: syncmove-db-replica
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syncmove
      MYSQL_USER: syncmove
      MYSQL_PASSWORD: syncmovepass
    ports:
      - "3308:3306"
    depends_on:
      mariadb-primary:
        condition: service_healthy
    networks:
      - syncmove-network
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --log-bin=mysql-bin
      --relay-log=/var/lib/mysql/mysql-relay-bin
      --read-only=1
      --gtid-strict-mode=ON
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db-failover:
    image: mariadb:10.11
    container_name: syncmove-db-failover
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
    environment:
      PRIMARY_HOST: mariadb-primary
      REPLICA_HOST: mariadb-replica
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      REPLICA_USER: replica
      REPLICA_PASSWORD: replica
    volumes:
      - ./scripts:/scripts:rw
    networks:
      - syncmove-network
    command: >
      bash -c "chmod +x /scripts/*.sh 2>/dev/null || true; /scripts/db-failover.sh"
    restart: unless-stopped

  app-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmove-app-1
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-primary:3306/syncmove
      REPLICA_DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-replica:3306/syncmove
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      # This value is consumed by the browser, so it must resolve from the
      # host, not from inside the Docker network.
      NEXT_PUBLIC_MEDIASOUP_URL: ws://localhost:3333
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_started
      mediasoup-sfu:
        condition: service_started
    ports:
      - "3001:3000"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: sh -c "npx prisma generate && npm run start"

  app-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmove-app-2
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-primary:3306/syncmove
      REPLICA_DATABASE_URL: mysql://syncmove:syncmovepass@mariadb-replica:3306/syncmove
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}
      NEXT_PUBLIC_MEDIASOUP_URL: ws://localhost:3333
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_started
      mediasoup-sfu:
        condition: service_started
    ports:
      - "3002:3000"
    networks:
      - syncmove-network
    restart: unless-stopped
    command: sh -c "npx prisma generate && npm run start"

volumes:
  mariadb-primary-data:

networks:
  syncmove-network:
    driver: bridge
