# Coturn TURN Server Configuration
# For SyncMove WebRTC NAT Traversal

# Listening port
listening-port=3478
tls-listening-port=5349

# Alternative ports (for WebRTC)
alt-listening-port=0
alt-tls-listening-port=0

# Listening IP (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP (if server has public IP, uncomment and set)
# external-ip=YOUR_SERVER_PUBLIC_IP

# Realm (domain for authentication)
realm=syncmove.local

# Authentication secret (shared with app via COTURN_SECRET env)
static-auth-secret=${COTURN_SECRET}

# Certificate files (uncomment and set paths for TLS)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem

# Private key password (if pkey is encrypted)
# pkey-pwd=password

# Enable TLS (required for WebRTC)
use-tls

# Enable verbose logging (disable in production)
# verbose

# Disable log file
no-stdout-log

# Log file (optional)
# log-file=/var/log/coturn/turnserver.log

# Minimum and maximum port for relay
min-port=49152
max-port=65535

# Long-term credential mechanism (for WebRTC)
lt-cred-mech

# No authentication override
# no-multicast-peers

# Total quota
# total-quota=0

# Maximum bps (0 = unlimited)
# max-bps=0

# Enable UDP relay
udp-relay

# Enable TCP relay
tcp-relay

# No STUN
# no-stun

# Fingerprint
fingerprint

# Authentication lifetime (default 86400 seconds = 24 hours)
stale-nonce

# Check origin
# check-origin-consistency

# CA file for TLS
# ca-file=/etc/ssl/certs/ca-certificates.crt

# Cipher list (TLS 1.2+ only for security)
# cipher-list=ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256

# EC curve name (for ECDSA certificates)
# ec-curve-name=prime256v1

# DH key length (for TLS)
# dh2048

# Enable mobile support
mobility

# No software attribute
# no-software-attribute

# Reserved dependency
# reserved-for-ice

# GCM (uncomment for better performance on modern CPUs)
# gcm

# Rate limit
# rate-limit

# Per-user limit
# user-quota