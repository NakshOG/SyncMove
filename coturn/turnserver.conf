# Coturn TURN Server Configuration
# Local-safe config for SyncMove WebRTC NAT traversal.
# This is intentionally plain and explicit so the container starts reliably
# without unsupported env expansion in the config file.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

realm=syncmove.local
user=syncmove:your-secret-key-here
lt-cred-mech
fingerprint
min-port=49152
max-port=65535
mobility
stale-nonce

# Local dev defaults; set these to real values if you want to expose this externally.
# external-ip=YOUR_SERVER_PUBLIC_IP
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem
# verbose
# no-stdout-log
